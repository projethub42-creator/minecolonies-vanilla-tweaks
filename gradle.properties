org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

## Environment
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.251
loader_version_range=[1,)

## MineColonies (jars in ./libs, never bundled)
# The screens rely on MineColonies' internal (non-API) classes, so they are built against this exact version;
# with a newer one, any screen that no longer fits switches itself off and MineColonies' own window is used.
minecolonies_version=1.1.1406-1.21.1-snapshot
minecolonies_version_range=[1.1.1368-1.21.1,)
structurize_version=1.0.837-1.21.1-snapshot
blockui_version=1.0.212-1.21.1-snapshot
domum_version=1.0.236-snapshot-main
# Optional (MineColonies doesn't require it): only its settings window is replaced, when present.
multipiston_version=1.2.58-1.21.1

## Mod properties
mod_id=mcvanillatweaks
mod_name=MineColonies Vanilla Tweaks
mod_license=GPL-3.0-or-later
mod_version=1.5.11
mod_group_id=fr.mcvanillatweaks
mod_authors=projethub42
